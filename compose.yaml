services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cloudtrap-cowrie
    restart: unless-stopped

    ports:
      - "127.0.0.1:2222:2222"

    volumes:
      - ./data/cowrie/var:/cowrie/cowrie-git/var

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  dashboard:
    build:
      context: ./services/dashboard
    container_name: cloudtrap-dashboard
    restart: unless-stopped

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      CLOUDTRAP_DATA_DIR: /data/processed

    volumes:
      - ./data/processed:/data/processed:ro

    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/').read()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
