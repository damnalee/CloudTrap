services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cloudtrap-cowrie
    restart: unless-stopped

    ports:
      - "127.0.0.1:2222:2222"

    volumes:
      - ./data/cowrie/var:/cowrie/cowrie-git/var

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  dashboard:
    build:
      context: ./services/dashboard
    container_name: cloudtrap-dashboard
    restart: unless-stopped

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      CLOUDTRAP_DATA_DIR: /data/processed
      CLOUDTRAP_DATA_SOURCE: dynamodb
      CLOUDTRAP_ENDPOINT_URL: http://localstack:4566
      EVENTS_TABLE: CloudTrapEvents
      ALERTS_TABLE: CloudTrapAlerts
      INCIDENTS_TABLE: CloudTrapIncidents
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

    volumes:
      - ./data/processed:/data/processed:ro

    depends_on:
      localstack:
        condition: service_healthy

    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/').read()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  localstack:
    image: localstack/localstack:4.14.0
    container_name: cloudtrap-localstack
    restart: unless-stopped

    ports:
      - "127.0.0.1:4566:4566"

    environment:
      SERVICES: s3,sqs,dynamodb,lambda,iam,logs,sns,cloudwatch
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
      LAMBDA_DOCKER_NETWORK: cloudtrap_default
      SQS_ENDPOINT_STRATEGY: domain

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - ./services/lambda:/opt/lambda-src/lambda:ro
      - ./services/processor/app:/opt/lambda-src/processor:ro
      - ./data/cowrie/var/log/cowrie:/cowrie-logs:ro
      - ./data/processed:/processed:ro
      - localstack_data:/var/lib/localstack

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  localstack_data:
