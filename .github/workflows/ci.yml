name: CloudTrap CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m compileall -q services scripts
      - run: python -m unittest discover -s services/processor/tests -v
      - run: python scripts/package_lambda.py && unzip -l infra/terraform/build/cloudtrap-ingest.zip
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/package_lambda.py
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.14.0"}
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
